geological_condition: moderat
geological_condition_justification: 'PLACEHOLDER - BUKAN PENILAIAN GEOLOG. Teks ini
  ditulis operator tool untuk dry run Phase 0 dan HARUS diganti sebelum angka apa
  pun dipakai. Penilaian sebenarnya wajib menguraikan, dengan bukti dari data: kontinuitas
  seam antar lubang, keberadaan dan rapat sesar, variasi ketebalan seam secara lateral,
  dan besaran serta keseragaman dip. Kondisi ''moderat'' di bawah ini adalah nilai
  default template, bukan kesimpulan dari data BGG Blok Lawai 1.'
